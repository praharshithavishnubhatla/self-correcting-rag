services:
  - type: web
    name: exam-rag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                   # Render's free web service — no card required.
                                  # Tradeoffs: sleeps after 15 min idle (cold start
                                  # ~30-60s on next request), no persistent disk, so
                                  # data/processed indexes are rebuilt on boot from
                                  # data/raw via the startup hook in api/main.py.
    envVars:
      - key: GROQ_API_KEY
        sync: false               # set manually in Render dashboard
      - key: API_KEY
        generateValue: true       # random value; required by /ingest, /ingest/batch, /eval
      # DATABASE_URL intentionally omitted — nothing in the code reads it yet.
    healthCheckPath: /health